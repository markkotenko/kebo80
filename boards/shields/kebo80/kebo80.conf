# Enable BLE
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_HIDS=y

# Enable settings (required for Studio)
CONFIG_SETTINGS=y
CONFIG_BT_SETTINGS=y

# Advertising
CONFIG_ZMK_BLE_ADV=y
CONFIG_ZMK_BLE_ADV_START_ON_BOOT=y

# Use the external 32kHz crystal
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
